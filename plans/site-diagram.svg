.awning-rule{ stroke:#E4C583; stroke-width:1; opacity:.8; }

.site-boundary{ fill:none; stroke:#767676; stroke-width:1; stroke-dasharray:3 2; }
.site-inn{ fill:#E7D9C2; stroke:#111111; stroke-width:1.4; }
.site-gh{ fill:#EADFC5; stroke:#111111; stroke-width:1.4; }
.site-drive{ stroke:#767676; stroke-width:2; stroke-dasharray:1 2.5; }</style>
<rect x="4" y="18" width="192" height="119" class="site-boundary"/>
