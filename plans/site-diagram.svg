<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 145" class="planart" role="img" aria-label="Schematic site diagram showing the guest house sited well apart from the inn, sharing a driveway, not to survey scale"><style>svg.planart,svg.elevart{ background:#FFFFFF; }
.wall{ fill:#F6EFDC; stroke:#111111; stroke-width:2.4; }
